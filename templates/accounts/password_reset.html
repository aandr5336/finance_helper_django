{% extends 'base.html' %}
{% block title %}Скидання пароля{% endblock %}
{% block content %}
<div class="card-soft p-4 col-md-6">
  <h1 class="h3 mb-3">Скидання пароля</h1>
  <p class="text-muted">Введіть email акаунта — надішлемо посилання для нового пароля.</p>
  <p class="small text-muted-fh">Для демо: <code>demo@financehelper.local</code></p>
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-accent" type="submit">Надіслати</button>
  </form>
</div>
{% endblock %}
