{% extends 'base.html' %}
{% block title %}Зміна пароля{% endblock %}
{% block content %}
<div class="card-soft p-4 col-md-6">
  <h1 class="page-title mb-3">Зміна пароля</h1>
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-accent" type="submit">Зберегти</button>
  </form>
</div>
{% endblock %}
