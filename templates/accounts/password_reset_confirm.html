{% extends 'base.html' %}
{% block title %}Новий пароль{% endblock %}
{% block content %}
<div class="card-soft p-4 col-md-6">
  <h1 class="h3 mb-3">Новий пароль</h1>
  {% if validlink %}
  <form method="post">{% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-accent" type="submit">Зберегти</button>
  </form>
  {% else %}
  <p class="text-danger">Посилання недійсне або застаріле.</p>
  {% endif %}
</div>
{% endblock %}
