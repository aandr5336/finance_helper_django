{% extends 'base.html' %}
{% block title %}Видалення цілі{% endblock %}
{% block content %}
<div class="card-soft p-4 col-lg-6">
  <h1 class="page-title">Видалити «{{ object }}»?</h1>
  <form method="post" class="mt-4">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Видалити</button>
    <a class="btn btn-outline-fh" href="{{ object.get_absolute_url }}">Скасувати</a>
  </form>
</div>
{% endblock %}
